<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="wkthree.css">
</head>
<body class="body">
    <div class="container">
        <h1 id="registration-heading" class="heading">Registration Form</h1>
        <form action="" method="post" id="registration-form" class="form">
            <div class="form-group">
                <label for="fname" class="label">FirstName:</label>
                <input type="text" id="fname" name="fname" required class="input-text"><br><br>
            </div>
            <div class="form-group">
                <label for="lname" class="label">LastName:</label>
                <input type="text" id="lname" name="lname" required class="input-text"><br><br>
            </div>
            <div class="form-group">
                <label for="email" class="label">Email:</label>
                <input type="email" id="email" name="email" required class="input-text"><br><br>
            </div>
            <div class="form-group">
                <label for="password" class="label">Password:</label>
                <input type="password" id="password" name="password" min="8" max="20" required class="input-text"><br><br>
            </div>
            <div class="form-group">
                <label for="birthdate" class="label">Birthdate:</label>
                <input type="date" id="birthdate" name="birthdate" required class="input-text"><br><br>
            </div>
            <div class="form-group">
                <label class="label">Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="female" name="gender" value="Female" class="input-radio">
                    <label for="female" class="radio-label">Female</label>
                    <input type="radio" id="male" name="gender" value="Male" class="input-radio">
                    <label for="male" class="radio-label">Male</label><br><br>
                </div>
            </div>
            <div class="form-group">
                <label for="country" class="label">Country:</label>
                <select name="Country" id="Country" class="select">
                    <option value="">--Select Country--</option>
                    <option value=""Uganda">Uganda</option>
                    <option value="Kenya">Kenya</option>
                    <option value="Tanzania">Tanzania</option>
                    <option value="Rwanda">Rwanda</option>
                </select>
                <br><br>
            </div>
            <div class="form-group">
                <label for="Biography" class="label">Biography:</label><br><br>
                <textarea id="description" name="description" placeholder="Write your Biography" class="textarea"></textarea><br><br>
            </div>
            <div class="form-group">
                <input type="checkbox" id="terms" name="terms" required class="input-checkbox">
                <label for="terms" class="label checkbox-label">I agree to the terms and conditions</label><br><br>
            </div>
            <button type="submit" class="submit-button button">Submit</button>
        </form>
    </div>
</body>
</html>
